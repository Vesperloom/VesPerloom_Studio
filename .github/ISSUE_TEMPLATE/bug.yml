name: Bug report
description: Report a reproducible studio, engine or runner issue.
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal command or a public-safe capsule. Remove tokens and private prompts.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Node version and model ID
